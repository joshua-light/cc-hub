[package]
name = "cc-hub"
version.workspace = true
edition.workspace = true

[dependencies]
cc-hub-lib = { path = "../lib" }
serde_json = "1"
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
chrono.workspace = true
log.workspace = true
simplelog.workspace = true
# Same `time` simplelog uses — needed directly because simplelog's
# re-exported `format_description!` macro expands to `time::` paths.
time = { version = "0.3", features = ["macros"] }

# getloadavg for the periodic `sys: loadavg=` forensics line; unix-only —
# Windows builds fall back to a no-op.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
