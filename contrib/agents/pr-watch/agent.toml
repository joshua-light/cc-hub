# Watches a git remote's open pull requests through a watcher script and
# reports changes. The hub knows nothing about GitHub/BitBucket: swap
# watch.sh for whatever prints your PR list.
#   cc-hub agent new pr-watch --from contrib/agents/pr-watch
description = "Watch my open PRs; note review comments, CI results, approvals"
enabled = false                  # flip on once watch.sh works for you

[trigger]
kind = "poll"
command = "./watch.sh"           # non-empty stdout = one event, deduped on content
interval_s = 300

[run]
tools = ["Read", "Write", "Glob", "Bash(cc-hub agent *)"]
model = "sonnet"
effort = "low"
window_pct = 32
max_turns = 30
max_budget_usd = 0.50
daily_budget_usd = 5.0

[prompt]
append = """
You watch the user's open pull requests. Your only memory is work/prs.json:
a map from PR number to the last state you reported. Read it first; treat a
missing file as empty."""

instruction = """
The event below is the current list of open PRs (JSON).
1. Read work/prs.json. Diff each PR against what you recorded.
2. For every PR whose reviews, checks, or mergeability changed, run
   `cc-hub agent note --text "<one line: PR number, what changed>"`.
   Use --level warn for failing checks or requested changes.
3. Write the new list to work/prs.json. If nothing changed, reply NOCHANGE.
Stop."""
