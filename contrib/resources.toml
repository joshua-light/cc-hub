# Subscription accounts; authentication and tools stay profile-local.
[settings]
warn_percent = 80
start_percent = 85
stop_percent = 95
refresh_seconds = 60
max_attempts = 20

[accounts.cc-1]
provider = "claude"
home_mode = "default"
start_percent = 75 # Reserve for meetings.
args = ["--dangerously-skip-permissions"]
max_workers = 2
capabilities = ["task-workflow"]
[accounts.cc-1.models]
"claude-sonnet-5[1m]" = ["medium"]

[accounts.cc-2]
provider = "claude"
home = "~/.claude-personal"
args = ["--dangerously-skip-permissions"]
max_workers = 2
capabilities = ["task-workflow"]
[accounts.cc-2.models]
"claude-sonnet-5[1m]" = ["medium"]

[accounts.codex-1]
provider = "codex"
home = "~/.codex"
args = ["--yolo"]
max_workers = 2
capabilities = ["task-workflow"]

[accounts.codex-2]
provider = "codex"
home = "~/.codex-personal"
args = ["--yolo"]
max_workers = 2
capabilities = ["task-workflow"]

# Hosts commands can run on, and the resources that live on them. A resource
# is anything only one session may use at a time; nothing here says who needs
# one — a session claims what its work needs while it runs.
[hosts.main]
[hosts.wh]
ssh = "workhorse"

[resources.main-tps]
host = "main"
description = "TPS checkout + Unity Editor on this machine"
[resources.wh-tps]
host = "wh"
description = "TPS checkout + Unity Editor on the workhorse"
[resources.android]
host = "wh"
description = "Android phone, for installing and running a client build"

[profiles.sonnet-medium]
provider = "claude"
model = "claude-sonnet-5[1m]"
effort = "medium"
autocompact = 350_000 # Compact well inside the 1M window.
accounts = ["cc-1", "cc-2"]
[profiles.luna-medium]
provider = "codex"
model = "gpt-5.6-luna"
effort = "medium"
accounts = ["codex-1", "codex-2"]

[routing.default.implementation]
profiles = ["sonnet-medium", "luna-medium"]
requires = ["task-workflow"]

[routing.default.verification]
profiles = ["sonnet-medium", "luna-medium"]
requires = ["task-workflow"]


[routing.project.implementation]
profiles = ["sonnet-medium", "luna-medium"]
requires = ["task-workflow"]

[routing.project.verification]
profiles = ["sonnet-medium", "luna-medium"]
requires = ["task-workflow"]
